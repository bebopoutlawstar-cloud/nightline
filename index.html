<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07041A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NightLine</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --night:#07041A; --deep:#140A3A; --cyan:#00F0FF; --mag:#C65AAE; --plum:#2A1B4A; --volt:#F3FF3A; --white:#F4F7FF; --muted:#A9A3D6; --red:#FF5A5A;
  --num:"Anton",Impact,sans-serif; --tech:"Orbitron","Arial Black",sans-serif; --body:"Rajdhani","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){}}
:root[data-theme="dark"]{}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night)}
body{font-family:var(--body);color:var(--white);overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--volt);outline-offset:3px}
.hidden{display:none!important}
.sr{position:absolute;left:-9999px}

.sky{position:fixed;inset:0;z-index:0;background:
  radial-gradient(circle at 80% 10%,rgba(198,90,174,.16),transparent 45%),
  radial-gradient(circle at 10% 90%,rgba(0,240,255,.25),transparent 50%),
  linear-gradient(180deg,var(--night),var(--deep))}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.screen{position:relative;z-index:1;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column}

/* ===== front date stamp ===== */
.front{overflow-y:auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 24px)}
.front-inner{margin:auto 0;display:flex;flex-direction:column;gap:48px}
.stamp{position:relative;width:min(100%,400px);aspect-ratio:1.6;margin:0 auto;transform:rotate(-7deg)}
.stamp > *{position:absolute}
.plate,.glow{inset:6% 4% 18% 2%;clip-path:polygon(0 18%,74% 0,100% 12%,96% 100%,6% 86%)}
.plate{background:var(--night);border:4px solid var(--cyan);box-shadow:0 0 0 4px var(--mag) inset}
.glow{background:var(--cyan);filter:blur(18px);opacity:.35;z-index:-1}
.month{left:6%;top:20%;font-family:var(--num);font-size:clamp(66px,22vw,108px);line-height:.8;color:var(--night);-webkit-text-stroke:3px var(--cyan);text-shadow:4px 4px 0 var(--mag);transform:rotate(-10deg)}
.slash{left:23%;top:28%;width:12%;height:62%;background:var(--mag);clip-path:polygon(75% 0,100% 0,25% 100%,0 100%)}
.day{left:34%;top:4%;font-family:var(--num);font-size:clamp(104px,36vw,168px);line-height:.85;color:var(--white);text-shadow:-4px 0 0 var(--cyan),5px 5px 0 var(--mag)}
.icon{right:0;top:0;width:28%;aspect-ratio:1;background:var(--volt);clip-path:polygon(8% 0,100% 10%,92% 100%,0 88%);display:grid;place-items:center;transform:rotate(9deg)}
.icon svg{width:74%;height:74%}
.weekday{right:2%;bottom:22%;font-family:var(--tech);font-weight:900;font-size:clamp(17px,5.6vw,26px);background:var(--mag);color:var(--night);padding:2px 10px 0;transform:rotate(-12deg);border:3px solid var(--night);letter-spacing:1px}
.phase{left:-2%;bottom:-10%;font-family:var(--tech);font-weight:900;font-size:clamp(24px,8.5vw,40px);color:var(--cyan);background:var(--night);padding:0 12px;border:3px solid var(--cyan);transform:rotate(4deg)}

/* ===== cards / forms ===== */
.card{display:grid;gap:12px;animation:rise .45s .15s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.tabs{display:flex;gap:8px}
.tab{flex:1;background:none;border:2px solid var(--cyan);color:var(--cyan);padding:9px;font-family:var(--tech);font-size:13px}
.tab[aria-selected="true"]{background:var(--cyan);color:var(--night)}
.card label{font-family:var(--tech);font-size:12px;color:var(--cyan);letter-spacing:.5px}
.field{width:100%;background:rgba(7,4,26,.85);color:var(--white);border:2px solid var(--cyan);padding:12px 14px;font-size:18px;clip-path:polygon(0 0,97% 0,100% 30%,100% 100%,3% 100%,0 70%)}
.go{font-family:var(--tech);font-weight:900;font-size:21px;background:var(--mag);color:var(--night);border:none;padding:14px;margin-top:4px;clip-path:polygon(0 10%,100% 0,98% 90%,2% 100%);box-shadow:0 0 10px rgba(198,90,174,.35)}
.go:active{transform:scale(.97)}
.msgline{font-size:16px;min-height:20px;color:var(--volt)}
.msgline.bad{color:var(--red)}
.note{font-size:14px;color:var(--muted);text-align:center}
.whoami{display:flex;align-items:center;gap:12px}
.whoami .who-text{font-size:17px;line-height:1.1}
.whoami .who-text b{font-family:var(--tech);color:var(--mag);font-size:15px}
.ghost{margin-left:auto;background:none;border:2px solid var(--cyan);color:var(--cyan);padding:6px 10px;font-family:var(--tech);font-size:11px}

/* avatars */
.face{flex:none;width:48px;height:48px;display:grid;place-items:center;font-family:var(--tech);font-weight:900;font-size:22px;color:var(--night);background:var(--c,var(--cyan));clip-path:polygon(10% 0,100% 8%,90% 100%,0 92%);overflow:hidden;border:none;padding:0}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.sm{width:40px;height:40px;font-size:18px}
.face.lg{width:132px;height:132px;font-size:60px}

/* ===== chat ===== */
.top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:2px solid var(--mag);background:rgba(7,4,26,.78);backdrop-filter:blur(6px)}
.mini{font-family:var(--num);font-size:32px;line-height:1;transform:rotate(-6deg);color:var(--white);text-shadow:-2px 0 var(--cyan),3px 3px var(--mag)}
.mini small{font-family:var(--tech);font-size:10px;color:var(--volt);margin-left:3px;vertical-align:middle}
.roombox{min-width:0}
.roomname{font-family:var(--tech);font-size:13px;color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:13px;color:var(--muted)}
.top .ghost{margin-left:0;padding:6px 8px}
.top #inviteBtn{margin-left:auto}
@media (max-width:420px){.mini{display:none}}
.linkbtn{background:none;border:none;color:var(--cyan);text-decoration:underline;text-underline-offset:3px;justify-self:start;font-size:16px;padding:0}
.roomcard-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .field{text-align:left;font-size:15px}

.feed{flex:1;overflow-y:auto;padding:18px 10px;display:flex;flex-direction:column;gap:16px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:17px;max-width:24ch}
.msg{display:flex;align-items:flex-start;max-width:92%;transform:rotate(var(--tilt,0));animation:snap .26s cubic-bezier(.2,1.6,.4,1) both}
.msg.t1{--tilt:-1.5deg}.msg.t2{--tilt:1deg}
.msg.me{align-self:flex-end;flex-direction:row-reverse;animation-name:snapR}
@keyframes snap{from{opacity:0;transform:translateX(-36px) rotate(-8deg)}}
@keyframes snapR{from{opacity:0;transform:translateX(36px) rotate(8deg)}}
.msg .face{position:relative;top:16px;transform:rotate(-8deg);z-index:2}
.msg.me .face{transform:rotate(8deg)}
.col{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.me .col{align-items:flex-end}
.tag{font-family:var(--tech);font-size:12px;background:var(--night);color:var(--white);border:2px solid var(--cyan);padding:2px 8px;margin:0 0 -3px 12px;transform:rotate(-3deg);position:relative;z-index:1;white-space:nowrap}
.me .tag{margin:0 12px -3px 0;transform:rotate(3deg);color:var(--white);border-color:var(--mag)}
.tag b{color:var(--volt);margin-right:6px}
.bubble{position:relative;padding:14px 22px;font-size:19px;font-weight:600;line-height:1.25;overflow-wrap:anywhere;color:var(--white);filter:drop-shadow(3px 3px 0 rgba(198,90,174,.55)) drop-shadow(0 0 6px rgba(0,240,255,.25))}
.bubble::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--night);clip-path:polygon(0 14%,97% 0,100% 58%,93% 100%,3% 88%);box-shadow:inset 0 0 0 2px var(--cyan)}
.me .bubble{color:var(--white);filter:drop-shadow(-3px 3px 0 rgba(0,240,255,.55))}
.me .bubble::before{background:var(--plum);box-shadow:inset 0 0 0 2px var(--mag);clip-path:polygon(3% 0,100% 12%,96% 90%,7% 100%,0 48%)}
.bubble a{color:var(--volt);text-decoration:underline;text-underline-offset:3px}
.me .bubble a{color:var(--volt);font-weight:700}
.shot{display:block;border:none;padding:0;background:none;margin:2px 0 6px}
.shot img{display:block;max-width:min(62vw,260px);max-height:320px;border:3px solid var(--cyan);transform:rotate(-1deg)}
.me .shot img{border-color:var(--mag)}

.compose{padding:8px 12px calc(env(safe-area-inset-bottom) + 12px);background:rgba(7,4,26,.92);border-top:2px solid var(--cyan)}
.pending{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:15px;color:var(--muted)}
.pending img{width:56px;height:56px;object-fit:cover;border:2px solid var(--mag)}
.pending button{background:none;border:2px solid var(--muted);color:var(--muted);padding:2px 8px}
.row{display:flex;gap:8px;align-items:flex-end}
.clip{flex:none;width:46px;height:46px;background:var(--deep);border:2px solid var(--mag);display:grid;place-items:center}
.clip svg{width:24px;height:24px}
.row textarea{flex:1;resize:none;background:var(--deep);color:var(--white);border:2px solid var(--cyan);padding:11px 12px;font-size:17px;max-height:120px;min-height:46px}
.send{flex:none;font-family:var(--tech);font-weight:900;font-size:15px;background:var(--cyan);color:var(--night);border:none;padding:13px 15px;clip-path:polygon(0 0,100% 12%,92% 100%,6% 88%)}
.send:active{transform:scale(.92) rotate(-4deg)}

/* typing + read receipts */
.typing{padding:0 14px 8px;height:0;overflow:visible;position:relative}
.typing .pill{position:absolute;left:14px;bottom:10px;display:flex;align-items:center;gap:10px;background:var(--night);border:2px solid var(--cyan);box-shadow:3px 3px 0 var(--mag);padding:6px 12px;transform:rotate(-2deg);font-family:var(--tech);font-size:12px;color:var(--cyan);animation:pop .22s cubic-bezier(.2,1.6,.4,1) both;max-width:calc(100% - 28px)}
.typing .pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pop{from{opacity:0;transform:translateY(8px) rotate(-8deg) scale(.8)}}
.dots{display:flex;gap:5px;flex:none}
.dots i{width:9px;height:9px;background:var(--mag);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:hop 1s infinite ease-in-out}
.dots i:nth-child(2){background:var(--cyan);animation-delay:.15s}
.dots i:nth-child(3){background:var(--volt);animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-7px) rotate(45deg)}}
.receipt{align-self:flex-end;margin:-6px 10px 0 0;font-family:var(--tech);font-size:10px;letter-spacing:.5px;color:var(--muted);transform:rotate(2deg);display:flex;align-items:center;gap:6px}
.receipt.read{color:var(--volt)}
.receipt .mini-faces{display:flex}
.receipt .mini-faces .face{width:18px;height:18px;font-size:9px;margin-left:-4px;position:static;transform:none}

/* ===== overlays ===== */
.overlay{position:fixed;inset:0;z-index:10;background:rgba(7,4,26,.86);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{width:min(100%,380px);background:var(--night);border:3px solid var(--cyan);box-shadow:8px 8px 0 var(--mag);padding:26px 22px;display:grid;gap:14px;justify-items:center;text-align:center;transform:rotate(-1.5deg)}
.sheet h2{font-family:var(--tech);font-size:20px;color:var(--cyan)}
.sheet .uname{font-family:var(--tech);font-size:18px;color:var(--mag)}
.sheet .email{color:var(--muted);font-size:15px;margin-top:-10px}
.sheet .go{width:100%}
.sheet .ghost{margin:0;width:100%;padding:10px;font-size:13px}
.danger{background:none;border:2px solid var(--red);color:var(--red);width:100%;padding:10px;font-family:var(--tech);font-size:13px}
.lightbox img{max-width:100%;max-height:90dvh;border:3px solid var(--cyan);box-shadow:8px 8px 0 var(--mag)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== v3 additions ===== */
.sheet{max-height:calc(100dvh - 40px);overflow-y:auto}
.sheet .field{text-align:left;font-size:15px}
.sheet .left{justify-self:stretch;text-align:left;width:100%}
.sheet h3{font-family:var(--tech);font-size:13px;color:var(--cyan);justify-self:start;margin-top:4px}
.sub{color:var(--muted);font-size:15px;margin-top:-6px}

/* inbox */
.inbox{display:grid;gap:10px;margin-top:6px}
.inbox h3{font-family:var(--tech);font-size:12px;color:var(--cyan);letter-spacing:.5px}
.roomrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(7,4,26,.85);border:2px solid #3b2d80;color:var(--white);padding:10px 12px;clip-path:polygon(0 0,98% 0,100% 30%,100% 100%,2% 100%,0 70%)}
.roomrow:hover{border-color:var(--cyan)}
.roomrow .hash{flex:none;width:38px;height:38px;display:grid;place-items:center;font-family:var(--tech);font-weight:900;font-size:18px;color:var(--night);background:var(--cyan);clip-path:polygon(10% 0,100% 8%,90% 100%,0 92%)}
.roomrow .info{flex:1;min-width:0}
.roomrow .name{font-family:var(--tech);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roomrow .preview{font-size:16px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roomrow .when{flex:none;display:grid;justify-items:end;gap:4px;font-size:13px;color:var(--muted)}
.badge{font-family:var(--tech);font-size:11px;background:var(--volt);color:var(--night);padding:1px 7px;min-width:22px;text-align:center}

/* feed extras */
.daybreak{align-self:center;font-family:var(--tech);font-size:11px;color:var(--night);background:var(--cyan);padding:3px 12px;transform:rotate(-2deg);margin:6px 0;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}
.older{align-self:center;background:none;border:2px solid var(--cyan);color:var(--cyan);font-family:var(--tech);font-size:11px;padding:6px 12px}
.bubble{cursor:pointer}
.quote{display:block;border-left:3px solid var(--cyan);padding:2px 0 2px 8px;margin-bottom:6px;font-size:15px;font-weight:600;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border-top:none;border-right:none;border-bottom:none;text-align:left}
.quote b{color:var(--cyan);font-family:var(--tech);font-size:11px;margin-right:6px}
.me .quote{border-left-color:var(--volt)}
.reacts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 8px 0}
.me .reacts{justify-content:flex-end}
.react{font:inherit;font-size:15px;background:var(--night);color:var(--white);border:2px solid #3b2d80;padding:1px 8px;transform:rotate(-2deg);animation:pop .2s cubic-bezier(.2,1.6,.4,1) both}
.react.mine{border-color:var(--volt)}
.react span{font-family:var(--tech);font-size:11px;margin-left:4px}
.flash .bubble{animation:flash .9s ease}
@keyframes flash{30%{filter:drop-shadow(0 0 14px var(--volt))}}

/* composer reply chip */
.replying{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:15px;color:var(--muted);border-left:3px solid var(--volt);padding-left:8px}
.replying span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.replying b{color:var(--volt);font-family:var(--tech);font-size:11px}
.replying button{background:none;border:2px solid var(--muted);color:var(--muted);padding:2px 8px}

/* message menu */
.emoji-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.emoji-row button{font-size:26px;width:50px;height:50px;background:var(--deep);border:2px solid #3b2d80;transform:rotate(-3deg)}
.emoji-row button:nth-child(even){transform:rotate(3deg)}
.emoji-row button.on{border-color:var(--volt);box-shadow:3px 3px 0 var(--mag)}
.menu-preview{font-size:16px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* members */
.members{display:grid;gap:8px;width:100%}
.member{display:flex;align-items:center;gap:10px;text-align:left}
.member .face{width:34px;height:34px;font-size:15px}
.member .mname{flex:1;min-width:0;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .role{font-family:var(--tech);font-size:10px;color:var(--volt);margin-left:6px}
.member button{background:none;border:2px solid var(--red);color:var(--red);font-family:var(--tech);font-size:10px;padding:4px 8px}
.member button.unblock{border-color:var(--cyan);color:var(--cyan)}
.linkbtn{background:none;border:none;color:var(--cyan);text-decoration:underline;text-underline-offset:3px;justify-self:start;font-size:16px;padding:0}
.roomcard-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .ghost{margin-left:0;padding:6px 8px}
.top #roomBtn{margin-left:auto}
@media (max-width:420px){.mini{display:none}}

.typing{height:auto;padding:0 14px}
.typing .pill{position:static;display:inline-flex;margin:0 0 8px}
.emoji-row{gap:6px;flex-wrap:nowrap}
.emoji-row button{font-size:22px;width:42px;height:42px;padding:0}

.namerow{display:flex;gap:8px;width:100%}
.namerow .field{flex:1;min-width:0}
.namerow .send{padding:10px 14px}
.roomrow .code{font-size:13px;color:var(--muted);margin-left:6px;font-family:var(--body)}

/* ===== full-screen effects ===== */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#fxText{position:fixed;inset:0;pointer-events:none;z-index:21;display:grid;place-items:center;overflow:hidden}
.fx-banner{font-family:var(--num);font-size:clamp(64px,22vw,150px);line-height:.9;color:var(--white);background:var(--night);padding:6px 26px 0;border:5px solid var(--cyan);transform:rotate(-8deg) skewX(-8deg);text-shadow:-4px 0 var(--cyan),6px 6px var(--mag);box-shadow:10px 10px 0 var(--mag);clip-path:polygon(0 8%,100% 0,97% 100%,3% 92%);animation:slam 1.8s cubic-bezier(.2,1.4,.4,1) both;white-space:nowrap}
@keyframes slam{0%{opacity:0;transform:rotate(-8deg) skewX(-8deg) scale(3)}14%{opacity:1;transform:rotate(-8deg) skewX(-8deg) scale(.92)}22%{transform:rotate(-8deg) skewX(-8deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:rotate(-8deg) skewX(-8deg) scale(1.08) translateX(40px)}}
.fx-stamp{position:absolute;font-family:var(--num);font-size:clamp(40px,14vw,90px);color:var(--volt);-webkit-text-stroke:2px var(--night);text-shadow:4px 4px 0 var(--night),6px 6px 0 var(--mag);animation:stamp 1.6s cubic-bezier(.2,1.8,.4,1) both}
@keyframes stamp{0%{opacity:0;transform:rotate(var(--r)) scale(2.4)}18%{opacity:1;transform:rotate(var(--r)) scale(1)}75%{opacity:1}100%{opacity:0;transform:rotate(var(--r)) scale(.9)}}
.fx-shake{animation:fxshake .5s linear 2}
@keyframes fxshake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,4px)}}
.fx-list{justify-self:stretch;text-align:left;font-size:15px;color:var(--muted)}
.fx-list summary{font-family:var(--tech);font-size:12px;color:var(--cyan);cursor:pointer}
.fx-list ul{list-style:none;display:grid;gap:4px;margin-top:8px}
.fx-list b{color:var(--white)}
</style>
</head>
<body>
<div class="sky"><canvas id="stars"></canvas></div>

<!-- ============ FRONT ============ -->
<section class="screen front" id="front">
 <div class="front-inner">
  <div class="stamp">
    <div class="glow"></div><div class="plate"></div>
    <div class="month" id="sMonth"></div><div class="slash"></div>
    <div class="day" id="sDay"></div>
    <div class="icon" id="sIcon"></div>
    <div class="weekday" id="sWeek"></div>
    <div class="phase" id="sPhase"></div>
  </div>

  <!-- logged out -->
  <form class="card hidden" id="authCard" novalidate>
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" id="tabIn" aria-selected="true">Log in</button>
      <button type="button" class="tab" role="tab" id="tabUp" aria-selected="false">Sign up</button>
    </div>
    <div id="unameWrap" class="card hidden" style="animation:none">

      return m; },
    async deleteMessage(id){ for(const r of Object.values(rooms)) r.msgs=r.msgs.filter(m=>m.id!==id); setTimeout(()=>fire("msgGone",id),50); },
    async reactions(ids){ return reacts.filter(r=>ids.includes(r.message_id)); },
    async react(message_id,_room,emoji){ const r={message_id,user_id:"me",emoji}; reacts.push(r); setTimeout(()=>fire("reaction",r,true),30); },
    async unreact(message_id,uid,emoji){ const i=reacts.findIndex(r=>r.message_id===message_id&&r.user_id===uid&&r.emoji===emoji); if(i>=0) reacts.splice(i,1); setTimeout(()=>fire("reaction",{message_id,user_id:uid,emoji},false),30); },
    async blocks(){ return [...blocked]; }, async block(uid){ blocked.add(uid); }, async unblock(uid){ blocked.delete(uid); },
    async savePush(){}, async deletePush(){},
    subscribe(_room,h){ H=h; h.status("Demo mode"); const stop=()=>{H=null}; stop.typing=()=>{}; return stop; }

})();

async function enterRoom(code,token){

  $("jumpBtn").disabled=true; say("roomMsg","Checking the room…");
  let result;
  try{ result=await api.joinRoom(target,token); }
  catch(err){
    ["chat","roomSheet","msgMenu"].forEach(id=>show($(id),false)); show($("front")); show($("roomCard"));
    say("roomMsg", err.message==="private" ? "That room is private. Ask someone inside for an invite link." : "Couldn't join: "+err.message, true);

  }
  $("jumpBtn").disabled=false; say("roomMsg","");

  room=target; roomOwner=null; roomName=null;
  try{ localStorage.setItem("nl-room",room); }catch(e){}
  show($("front"),false); show($("chat")); $("roomLabel").textContent="# "+room; $("status").textContent="Connecting…";
  msgs.length=0; byId.clear(); elById.clear(); reactionsById.clear(); members.clear();
  typers.forEach(v=>clearTimeout(v.timer)); typers.clear(); paintTyping(); clearReply(); feed.innerHTML="";
  try{
    const [latest,mem,info]=await Promise.all([api.loadLatest(room),api.members(room).catch(()=>[]),api.roomInfo(room).catch(()=>null)]);
    roomOwner=info?.owner||null; setRoomName(info?.name);
    mem.forEach(setMember);

    if(result==="created"&&!latest.length) feed.innerHTML='<p class="empty">You made a new private room. Tap Room to name it and invite friends.</p>';
    markReadSoon();
    unsub=api.subscribe(room,{
      msg:m=>{ stopTyping(m.user_id); addMessages([m]).then(()=>{ if(m.user_id!==user.id) markReadSoon(); }); },
      msgGone:removeMessage,
      profile:p=>{ cache.set(p.id,p); repaintFaces(p.id); if(p.id===user.id){meProfile=p;paintMe();} paintReceipts(); },
      member:setMember,
      roomUpdated:r=>{ if(r.code!==room) return; setRoomName(r.name); if(r.owner!==undefined) roomOwner=r.owner; },
      memberGone:uid=>{
        if(uid===user.id){ exitRoom(); say("roomMsg",`You're no longer in # ${room||"that room"}.`,true); return; }
        members.delete(uid); paintReceipts(); if(!$("roomSheet").classList.contains("hidden")) paintMembers();
      },
      reaction:(r,added)=>{ if(!byId.has(r.message_id)) return; setReaction(r,added); refreshMsg(r.message_id); },
      typing:onTyping,
      status:s=>$("status").textContent=s
    });
  }catch(err){ $("status").textContent="Can't load messages. Check your Supabase setup."; }
}

/* ---------- messages ---------- */
function setReaction(r,added){
  let map=reactionsById.get(r.message_id); if(!map) reactionsById.set(r.message_id,map=new Map());
  let set=map.get(r.emoji); if(!set) map.set(r.emoji,set=new Set());
  added?set.add(r.user_id):set.delete(r.user_id);
  if(!set.size) map.delete(r.emoji);
}

async function addMessages(list){
  list=list.filter(m=>!byId.has(m.id)); if(!list.length) return;
  const replyIds=list.map(m=>m.reply_to).filter(id=>id&&!byId.has(id));
  await ensureProfiles(list.map(m=>m.user_id));
  (await api.reactions(list.map(m=>m.id)).catch(()=>[])).forEach(r=>setReaction(r,true));
  for(const id of [...new Set(replyIds)]){ const r=await api.fetchMessage(id).catch(()=>null); if(r){ r._context=true; byId.set(r.id,r); await ensureProfiles([r.user_id]); } }
  const appendOnly = msgs.length===0 || list.every(m=>m.created_at>=msgs[msgs.length-1].created_at);
  for(const m of list){ byId.set(m.id,m); msgs.push(m); }
  msgs.sort((a,b)=>a.created_at<b.created_at?-1:a.created_at>b.created_at?1:0);
  if(appendOnly && feed.querySelector(".msg,.empty,.older")) list.forEach(appendEl);
  else renderAll();
}

function visible(m){ return !blocked.has(m.user_id); }

function renderAll(keepBottom=true){
  const prevH=feed.scrollHeight, prevTop=feed.scrollTop;
  feed.innerHTML=""; elById.clear();
  if(hasMore){ const b=el("button","older","Load older messages"); b.type="button"; b.onclick=loadOlder; feed.append(b); }
  let lastDay=null, n=0;
  for(const m of msgs){
    if(!visible(m)) continue;
    const k=dayKey(m.created_at);
    if(k!==lastDay){ feed.append(el("div","daybreak",dayLabel(m.created_at))); lastDay=k; }
    const node=buildMsg(m,n++); elById.set(m.id,node); feed.append(node);
  }
  if(!n && !hasMore) feed.append(el("p","empty","Nobody has said anything here yet. Start it off."));
  paintReceipts();
  feed.scrollTop = keepBottom ? feed.scrollHeight : feed.scrollHeight-prevH+prevTop;
}

function appendEl(m){
  if(!visible(m)) return;
  feed.querySelector(".empty")?.remove();
  const prev=[...elById.keys()].map(id=>byId.get(id)).filter(Boolean).pop();
  if(!prev || dayKey(prev.created_at)!==dayKey(m.created_at)) feed.append(el("div","daybreak",dayLabel(m.created_at)));
  const node=buildMsg(m,elById.size); elById.set(m.id,node); feed.append(node);
  paintReceipts(); feed.scrollTop=feed.scrollHeight;
  playFx(m);
  if(m.user_id!==user.id && Date.now()-new Date(m.created_at)<15000 && navigator.vibrate) navigator.vibrate(30);
}

async function loadOlder(){
  if(!msgs.length) return;
  const btn=feed.querySelector(".older"); if(btn){ btn.disabled=true; btn.textContent="Loading…"; }
  try{
    const older=await api.loadBefore(room,msgs[0].created_at);
    hasMore=older.length>=PAGE;
    const fresh=older.filter(m=>!byId.has(m.id));
    await ensureProfiles(fresh.map(m=>m.user_id));
    (await api.reactions(fresh.map(m=>m.id)).catch(()=>[])).forEach(r=>setReaction(r,true));
    fresh.forEach(m=>{ byId.set(m.id,m); msgs.push(m); });
    msgs.sort((a,b)=>a.created_at<b.created_at?-1:1);
    renderAll(false);
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent="Couldn't load. Try again"; } }
}

function refreshMsg(id){
  const old=elById.get(id), m=byId.get(id); if(!old||!m) return;
  const node=buildMsg(m,old.classList.contains("t1")?0:old.classList.contains("t2")?1:2, true);
  old.replaceWith(node); elById.set(id,node); paintReceipts();
}
function removeMessage(id){
  if(!byId.has(id)) return;
  const i=msgs.findIndex(m=>m.id===id); if(i>=0) msgs.splice(i,1);
  byId.delete(id); reactionsById.delete(id);
  if(replyTo?.id===id) clearReply();
  if(menuMsg?.id===id) show($("msgMenu"),false);
  renderAll(false);
}

function buildMsg(m,index,noAnim){
  const p=cache.get(m.user_id)||{username:"Unknown"}, mine=m.user_id===user.id;
  const at=new Date(m.created_at), fresh=!mine&&Date.now()-at<15000;
  const node=el("div","msg t"+(index%3)+(mine?" me":"")); node.dataset.t=at.getTime(); node.dataset.id=m.id;
  if(noAnim) node.style.animation="none";
  const face=el("div","face"); face.dataset.uid=m.user_id; face.setAttribute("aria-hidden","true"); paintFace(face,p);
  const col=el("div","col");
  const tag=el("div","tag");
  if(fresh&&!noAnim) tag.append(el("b","","NEW"));
  tag.append(`${p.username} · ${timeOf(at)}`);
  const bub=el("div","bubble"); bub.tabIndex=0; bub.setAttribute("role","button"); bub.setAttribute("aria-label",`Message from ${p.username}. Open options`);
  if(m.reply_to){
    const r=byId.get(m.reply_to), q=el("button","quote"); q.type="button";
    if(r){ q.append(el("b","",nameOf(r.user_id))); q.append(r.text||(r.image_url?"📷 Photo":"")); q.onclick=e=>{ e.stopPropagation(); jumpTo(r.id); }; }
    else q.append("Original message was deleted");
    bub.append(q);
  }
  const img=safeImg(m.image_url);
  if(img){ const b=el("button","shot"); b.type="button"; b.setAttribute("aria-label","Open photo");
    const i=document.createElement("img"); i.src=img; i.alt="Photo from "+p.username; i.loading="lazy";
    i.onload=()=>{ if(feed.scrollHeight-feed.scrollTop-feed.clientHeight<400) feed.scrollTop=feed.scrollHeight; };
    b.append(i); b.onclick=e=>{ e.stopPropagation(); $("lightImg").src=img; show($("lightbox")); }; bub.append(b); }
  if(m.text){ const t=el("div"); linkify(t,m.text); bub.append(t); }
  bub.onclick=e=>{ if(e.target.closest("a")) return; openMenu(m); };
  bub.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openMenu(m); } };
  col.append(tag,bub);
  const map=reactionsById.get(m.id);
  if(map&&map.size){
    const row=el("div","reacts");
    for(const [emoji,set] of map){
      const r=el("button","react"+(set.has(user.id)?" mine":"")); r.type="button";
      r.append(emoji, el("span","",String(set.size)));
      r.setAttribute("aria-label",`${emoji} ${set.size}, ${set.has(user.id)?"remove your reaction":"add reaction"}`);
      r.title=[...set].map(nameOf).join(", ");
      r.onclick=()=>toggleReaction(m,emoji);
      row.append(r);
    }
    col.append(row);
  }
  node.append(face,col);
  return node;
}
function jumpTo(id){
  const node=elById.get(id); if(!node) return;
  node.scrollIntoView({behavior:"smooth",block:"center"});
  node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash");
}
function repaintFaces(uid){ feed.querySelectorAll(`.face[data-uid="${CSS.escape(uid)}"]`).forEach(n=>paintFace(n,cache.get(uid))); }

async function toggleReaction(m,emoji){
  const has=reactionsById.get(m.id)?.get(emoji)?.has(user.id);
  setReaction({message_id:m.id,user_id:user.id,emoji},!has); refreshMsg(m.id);   // instant feedback
  try{ has ? await api.unreact(m.id,user.id,emoji) : await api.react(m.id,room,emoji); }
  catch(err){ setReaction({message_id:m.id,user_id:user.id,emoji},has); refreshMsg(m.id); $("status").textContent="Reaction didn't save."; }
}

/* ---------- room sheet ---------- */
function setRoomName(name){
  roomName=(name||"").trim()||null;
  $("roomLabel").textContent=roomName||"# "+room;
  $("roomLabel").title=roomName?`${roomName} (#${room})`:"#"+room;
  paintRoomTitle();
}
function paintRoomTitle(){ $("rsTitle").textContent=roomName||"# "+room; $("rsCode").textContent=roomName?"#"+room:""; show($("rsCode"),!!roomName); }
$("nameForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("roomName").value.trim().replace(/\s+/g," ").slice(0,40);
  if(name===(roomName||"")) return say("rsMsg","That's already the name.");
  $("nameSave").disabled=true;
  try{ await api.renameRoom(room,name); setRoomName(name); say("rsMsg",name?`Room renamed to ${name}.`:"Room name cleared."); }
  catch(err){ say("rsMsg","Couldn't rename: "+err.message,true); }
  finally{ $("nameSave").disabled=false; }
});
function inviteUrl(code,token){ return location.origin+location.pathname+"?join="+encodeURIComponent(code)+"&t="+encodeURIComponent(token); }
$("roomBtn").onclick=async()=>{
  say("rsMsg",""); paintRoomTitle(); $("roomName").value=roomName||""; $("invLink").value="Loading…"; show($("roomSheet"));
  paintMembers();
  try{
    const info=await api.roomInfo(room); if(!info) throw new Error("Couldn't find this room.");
    roomOwner=info.owner; setRoomName(info.name); if(document.activeElement!==$("roomName")) $("roomName").value=roomName||""; paintMembers();
    $("invLink").value=inviteUrl(info.code,info.invite_token);
    show($("invReset"),info.owner===user.id); show($("invShare"),!!navigator.share);
  }catch(err){ $("invLink").value=""; say("rsMsg",err.message,true); }
};
async function paintMembers(){
  await ensureProfiles([...members.keys()]);
  const list=$("memberList"); list.innerHTML="";
  $("memTitle").textContent=`Members (${members.size})`;
  const ids=[...members.keys()].sort((a,b)=>(b===roomOwner)-(a===roomOwner)||nameOf(a).localeCompare(nameOf(b)));
  for(const uid of ids){
    const row=el("div","member"); const f=el("span","face"); paintFace(f,cache.get(uid));
    const n=el("span","mname",nameOf(uid)+(uid===user.id?" (you)":""));
    if(uid===roomOwner) n.append(el("span","role","OWNER"));
    row.append(f,n);
    if(roomOwner===user.id && uid!==user.id){
      const b=el("button","","Remove"); b.type="button";
      b.onclick=async()=>{
        if(!confirm(`Remove ${nameOf(uid)} from # ${room}? The invite link will also reset so they can't rejoin with it.`)) return;
        try{ await api.removeMember(room,uid); members.delete(uid); paintMembers(); paintReceipts();
          const info=await api.roomInfo(room).catch(()=>null); if(info) $("invLink").value=inviteUrl(info.code,info.invite_token);
          say("rsMsg",`Removed ${nameOf(uid)}. New invite link made.`); }
        catch(err){ say("rsMsg",err.message,true); }
      };
      row.append(b);
    }
    list.append(row);
  }
}

/* ---------- read receipts ---------- */
let readTimer=null;
function markReadSoon(){
  if(!room||document.hidden||$("chat").classList.contains("hidden")) return;
  clearTimeout(readTimer); readTimer=setTimeout(()=>api.markRead(room).catch(()=>{}),700);
}
function setMember(r){
  if(!r?.user_id) return;
  members.set(r.user_id, r.last_read_at?new Date(r.last_read_at).getTime():0);
  ensureProfiles([r.user_id]).then(paintReceipts);
}
function paintReceipts(){
  feed.querySelectorAll(".receipt").forEach(n=>n.remove());
  const mineEls=feed.querySelectorAll(".msg.me"); const last=mineEls[mineEls.length-1]; if(!last) return;
  const t=+last.dataset.t;
  const readers=[...members].filter(([uid,at])=>uid!==user.id&&at>=t&&!blocked.has(uid)).map(([uid])=>cache.get(uid)).filter(Boolean);
  const r=el("div","receipt"+(readers.length?" read":""));
  if(readers.length){
    const faces=el("span","mini-faces");
    readers.slice(0,4).forEach(p=>{ const f=el("span","face"); paintFace(f,p); faces.append(f); });
    r.append(faces,`Read by ${readers.length<=2?readers.map(p=>p.username).join(" & "):readers.length+" people"}`);
  } else r.textContent="Sent";
  last.after(r);
}

/* ---------- typing ---------- */
let lastTypingSent=0;
function paintTyping(){
  const box=$("typing"); const names=[...typers.values()].map(v=>v.name);
  if(!names.length){ box.innerHTML=""; return; }
  const label=names.length===1?`${names[0]} is typing`:names.length===2?`${names[0]} & ${names[1]} are typing`:"Several people are typing";
  let pill=box.querySelector(".pill");
  if(!pill){ pill=el("div","pill"); pill.innerHTML='<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span></span>'; box.append(pill); }
  pill.lastChild.textContent=label;
}
function onTyping(p){
  if(!p?.uid||p.uid===user?.id||blocked.has(p.uid)) return;
  if(!p.typing) return stopTyping(p.uid);
  clearTimeout(typers.get(p.uid)?.timer);
  typers.set(p.uid,{name:String(p.name||"Someone").slice(0,20),timer:setTimeout(()=>stopTyping(p.uid),4000)});
  paintTyping();
}
function stopTyping(uid){ const v=typers.get(uid); if(!v) return; clearTimeout(v.timer); typers.delete(uid); paintTyping(); }
function sendTyping(on){
  if(!unsub?.typing||!user) return;
  const now=Date.now(); if(on&&now-lastTypingSent<2000) return;
  lastTypingSent=on?now:0;
  try{ unsub.typing({uid:user.id,name:meProfile?.username,typing:on}); }catch(e){}
}

/* ================= PUSH NOTIFICATIONS ================= */
let swReg=null;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const installed=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  navigator.serviceWorker.register("sw.js").then(r=>swReg=r).catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{ if(e.data?.room && user){ ["profile","roomSheet","msgMenu"].forEach(id=>show($(id),false)); enterRoom(e.data.room); } });
}
function b64ToBytes(b){ const p="=".repeat((4-b.length%4)%4), s=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(s,c=>c.charCodeAt(0)); }
async function currentSub(){ return swReg ? swReg.pushManager.getSubscription() : null; }
async function paintNotif(){
  const btn=$("notifBtn");
  if(!sb||!VAPID_PUBLIC_KEY){ btn.disabled=true; btn.textContent="Notifications: not set up yet"; return; }
  if(isIOS&&!installed){ btn.disabled=true; btn.textContent="Add to Home Screen to get notifications"; return; }
  if(!swReg||!("PushManager" in window)){ btn.disabled=true; btn.textContent="Notifications not supported here"; return; }
  if(Notification.permission==="denied"){ btn.disabled=true; btn.textContent="Notifications blocked in settings"; return; }
  btn.disabled=false; btn.textContent=(await currentSub())?"Turn off notifications":"Turn on notifications";
}
async function pushOn(){
  if(await Notification.requestPermission()!=="granted") throw new Error("Permission wasn't given.");
  const sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(VAPID_PUBLIC_KEY)});
  await api.savePush(sub.toJSON());
}
async function pushOff(){ const sub=await currentSub(); if(!sub) return; await api.deletePush(sub.endpoint); await sub.unsubscribe(); }
$("notifBtn").onclick=async()=>{
  $("notifBtn").disabled=true;
  try{
    if(await currentSub()){ await pushOff(); say("profMsg","Notifications off."); }
    else { await pushOn(); say("profMsg","Notifications on for rooms you've joined."); }
  }catch(err){ say("profMsg",err.message,true); }
  paintNotif();
};


/* ================= FULL-SCREEN EFFECTS ================= */
const FX_TRIGGERS=[
  {fx:"confetti", label:"Confetti",       words:["happy birthday","hbd","congrats","congratulations"], emoji:["🎉","🎂","🥳"]},
  {fx:"hearts",   label:"Neon hearts",    words:["love you","ily","luv u","love u"], emoji:["❤️","💖","😍","🥰","💕"]},
  {fx:"hype",     label:"Hype banner",    words:["let's go","lets go","gg","hype"], emoji:["🏆"]},
  {fx:"embers",   label:"Embers",         words:["lit"], emoji:["🔥"]},
  {fx:"laugh",    label:"Laugh stamps",   words:["lol","lmao","lmfao"], emoji:["😂","🤣"]},
  {fx:"rain",     label:"Rain",           words:["rip"], emoji:["😭","😢","💔"]},
  {fx:"night",    label:"Shooting stars", words:["good night","goodnight","gn"], emoji:["🌙","😴","🌠"]},
  {fx:"boom",     label:"Shockwave",      words:["boom","mind blown"], emoji:["💥","🤯"]},
];
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
FX_TRIGGERS.forEach(t=>t.re=new RegExp("(^|[^a-z0-9'])("+t.words.map(esc).join("|")+")(?=$|[^a-z0-9])","i"));
function fxFor(text){
  if(!text) return null;
  const norm=text.replace(/[’‘]/g,"'");
  let best=null, bestAt=Infinity;              // first trigger in the message wins
  for(const t of FX_TRIGGERS){
    const m=norm.match(t.re); if(m&&m.index<bestAt){ best=t; bestAt=m.index; }
    for(const e of t.emoji){ const i=norm.indexOf(e); if(i>=0&&i<bestAt){ best=t; bestAt=i; } }
  }
  return best;
}
const fxEnabled=()=>{ try{ return localStorage.getItem("nl-fx")!=="off"; }catch(e){ return true; } };
const fxPlayed=new Set();

const FX=(()=>{
  const canvas=document.createElement("canvas"); canvas.id="fx"; canvas.setAttribute("aria-hidden","true");
  const layer=document.createElement("div"); layer.id="fxText"; layer.setAttribute("aria-hidden","true");
  document.body.append(canvas,layer);
  const ctx=canvas.getContext("2d");
  const C=["#00F0FF","#F3FF3A","#E07AC6","#F4F7FF","#B18CFF"];
  const R=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
  let W=0,H=0,dpr=1,raf=0,run=null;
  function size(){ dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener("resize",size); size();
  function shake(){ const c=$("chat"); c.classList.remove("fx-shake"); void c.offsetWidth; c.classList.add("fx-shake"); setTimeout(()=>c.classList.remove("fx-shake"),1000); }
  function banner(text){ const b=el("div","fx-banner",text); layer.append(b); setTimeout(()=>b.remove(),1900); }
  function heart(x,y,s){ ctx.beginPath(); ctx.moveTo(x,y+s*.3); ctx.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3); ctx.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s); ctx.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3); ctx.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3); ctx.closePath(); }

  const effects={
    confetti:{dur:3200,init:()=>[...Array(170)].map(()=>({x:R(0,W),y:R(-H*.6,-10),vx:R(-1.5,1.5),vy:R(2,5),w:R(7,15),h:R(4,8),r:R(0,6.3),vr:R(-.2,.2),c:pick(C),ph:R(0,6)})),
      step:(ps,t)=>{ for(const p of ps){ p.vy+=.04; p.x+=p.vx+Math.sin(t/300+p.ph)*.8; p.y+=p.vy; p.r+=p.vr;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.beginPath(); ctx.moveTo(-p.w/2,-p.h/2); ctx.lineTo(p.w/2,-p.h/2+2); ctx.lineTo(p.w/2-2,p.h/2); ctx.lineTo(-p.w/2+1,p.h/2-1); ctx.fill(); ctx.restore(); } }},
    hearts:{dur:3200,init:()=>[...Array(38)].map(()=>({x:R(0,W),y:H+R(0,H*.6),vy:R(2,4.5),s:R(16,40),ph:R(0,6),c:pick(["#E07AC6","#00F0FF","#F3FF3A"])})),
      step:(ps,t)=>{ for(const p of ps){ p.y-=p.vy; const x=p.x+Math.sin(t/400+p.ph)*14; ctx.globalAlpha=Math.max(0,Math.min(1,p.y/(H*.35)));
        heart(x,p.y,p.s); ctx.fillStyle="rgba(7,4,26,.7)"; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=p.c; ctx.shadowColor=p.c; ctx.shadowBlur=12; ctx.stroke(); ctx.shadowBlur=0; } ctx.globalAlpha=1; }},
    embers:{dur:2800,init:()=>[...Array(170)].map(()=>({x:R(0,W),y:R(H*.35,H*1.3),vy:R(2.5,7),vx:R(-.6,.6),s:R(1.5,4.5),c:pick(["#FF8A3D","#F3FF3A","#E07AC6","#FF5A5A"]),ph:R(0,6)})),
      step:(ps,t)=>{ ctx.globalCompositeOperation="lighter"; for(const p of ps){ p.y-=p.vy; p.x+=p.vx+Math.sin(t/200+p.ph)*.6;
        ctx.globalAlpha=.5+.5*Math.abs(Math.sin(t/90+p.ph)); ctx.fillStyle=p.c; ctx.shadowColor=p.c; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.fill(); }
        ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over"; }},
    hype:{dur:1900,init:(txt)=>{ banner(txt); return [...Array(60)].map(()=>({a:R(0,6.3),len:R(.3,.7),w:R(1,4),c:pick(C)})); },
      step:(ps,t,k)=>{ const cx=W/2, cy=H/2, rMax=Math.hypot(W,H)/2; ctx.globalAlpha=(1-k)*.8;
        for(const p of ps){ if(Math.random()<.5) continue; const r0=rMax*(1-p.len)*(.6+.4*Math.random()); ctx.strokeStyle=p.c; ctx.lineWidth=p.w;
          ctx.beginPath(); ctx.moveTo(cx+Math.cos(p.a)*r0,cy+Math.sin(p.a)*r0); ctx.lineTo(cx+Math.cos(p.a)*rMax,cy+Math.sin(p.a)*rMax); ctx.stroke(); } ctx.globalAlpha=1; }},
    laugh:{dur:1900,init:()=>{ shake(); const words=["LOL","HA","LMAO","HA!","LOL"];
        words.forEach((w,i)=>setTimeout(()=>{ const s=el("span","fx-stamp",w); s.style.left=(i%2?R(45,65):R(5,25))+"%"; s.style.top=(12+i*15+R(-4,4))+"%"; s.style.setProperty("--r",R(-18,18)+"deg"); layer.append(s); setTimeout(()=>s.remove(),1700); },i*160));
        return []; }, step:()=>{} },
    rain:{dur:3000,init:()=>[...Array(220)].map(()=>({x:R(-W*.2,W*1.1),y:R(-H,0),v:R(12,22),l:R(12,30)})),
      step:(ps,t,k)=>{ ctx.fillStyle=`rgba(7,4,26,${.35*Math.sin(Math.PI*k)})`; ctx.fillRect(0,0,W,H);
        ctx.strokeStyle="rgba(0,240,255,.55)"; ctx.lineWidth=1.5; ctx.beginPath();
        for(const p of ps){ p.y+=p.v; p.x-=p.v*.18; if(p.y>H&&k<.7){ p.y=R(-60,0); p.x=R(0,W*1.2); } ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+p.l*.18,p.y-p.l); }
        ctx.stroke(); }},
    night:{dur:3200,init:()=>[...Array(26)].map((_,i)=>({x:R(W*.1,W*1.3),y:R(-H*.3,H*.6),v:R(10,16),delay:i*90,len:R(100,220),c:pick(["#F4F7FF","#00F0FF","#F3FF3A"])})),
      step:(ps,t,k)=>{ ctx.fillStyle=`rgba(7,4,26,${.3*Math.sin(Math.PI*k)})`; ctx.fillRect(0,0,W,H);
        for(const p of ps){ if(t<p.delay) continue; const d=(t-p.delay)/16*p.v, x=p.x-d, y=p.y+d*.55;
          const g=ctx.createLinearGradient(x,y,x+p.len,y-p.len*.55); g.addColorStop(0,p.c); g.addColorStop(1,"rgba(0,0,0,0)");
          ctx.strokeStyle=g; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+p.len,y-p.len*.55); ctx.stroke();
          ctx.fillStyle=p.c; ctx.shadowColor=p.c; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(x,y,2.5,0,7); ctx.fill(); ctx.shadowBlur=0; } }},
    boom:{dur:1700,init:()=>{ shake(); return {shards:[...Array(46)].map(()=>({a:R(0,6.3),v:R(6,16),s:R(6,16),r:R(0,6),c:pick(C)})),d:0}; },
      step:(st,t,k)=>{ const cx=W/2, cy=H/2;
        if(k<.25){ ctx.fillStyle=`rgba(243,255,58,${(.25-k)*2.6})`; ctx.fillRect(0,0,W,H); }
        ["#F3FF3A","#00F0FF","#E07AC6"].forEach((c,i)=>{ const kk=Math.max(0,k*1.4-i*.12); if(kk<=0||kk>1) return;
          ctx.strokeStyle=c; ctx.globalAlpha=1-kk; ctx.lineWidth=10*(1-kk)+2; ctx.beginPath(); ctx.arc(cx,cy,kk*Math.hypot(W,H)*.6,0,7); ctx.stroke(); });
        ctx.globalAlpha=1-k;
        for(const p of st.shards){ const d=p.v*t/16; ctx.save(); ctx.translate(cx+Math.cos(p.a)*d,cy+Math.sin(p.a)*d); ctx.rotate(p.r+t/200); ctx.fillStyle=p.c;
          ctx.beginPath(); ctx.moveTo(0,-p.s/2); ctx.lineTo(p.s/2,p.s/3); ctx.lineTo(-p.s/2,p.s/2); ctx.fill(); ctx.restore(); }
        ctx.globalAlpha=1; }},
  };
  function play(name,opts={}){
    if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const e=effects[name]; if(!e) return;
    cancelAnimationFrame(raf); layer.innerHTML=""; ctx.clearRect(0,0,W,H);
    const state=e.init(opts.text); const start=performance.now();
    const frame=now=>{ const t=now-start, k=Math.min(1,t/e.dur);
      ctx.clearRect(0,0,W,H); e.step(state,t,k);
      if(k<1) raf=requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H); };
    raf=requestAnimationFrame(frame);
  }
  return {play};
})();

function hypeText(text){
  const n=(text||"").toLowerCase().replace(/[’‘]/g,"'");
  if(/(^|[^a-z0-9])gg([^a-z0-9]|$)/.test(n)) return "GG!";
  if(/hype/.test(n)) return "HYPE!";
  if(n.includes("🏆")) return "WINNER!";
  return "LET'S GO!";
}
function playFx(m,force){
  if(!m?.text) return;
  const t=fxFor(m.text); if(!t) return;
  if(!force){ if(!fxEnabled()||document.hidden||fxPlayed.has(m.id)) return; if(Date.now()-new Date(m.created_at)>15000) return; }
  fxPlayed.add(m.id);
  FX.play(t.fx,{text:hypeText(m.text)});
}
