<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07041A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NightLine</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --night:#07041A; --deep:#140A3A; --cyan:#00F0FF; --mag:#FF2BD6; --volt:#F3FF3A; --white:#F4F7FF; --muted:#A9A3D6; --red:#FF5A5A;
  --num:"Anton",Impact,sans-serif; --tech:"Orbitron","Arial Black",sans-serif; --body:"Rajdhani","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){}}
:root[data-theme="dark"]{}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night)}
body{font-family:var(--body);color:var(--white);overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--volt);outline-offset:3px}
.hidden{display:none!important}
.sr{position:absolute;left:-9999px}

.sky{position:fixed;inset:0;z-index:0;background:
  radial-gradient(circle at 80% 10%,rgba(255,43,214,.35),transparent 45%),
  radial-gradient(circle at 10% 90%,rgba(0,240,255,.25),transparent 50%),
  linear-gradient(180deg,var(--night),var(--deep))}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.screen{position:relative;z-index:1;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column}

/* ===== front date stamp ===== */
.front{overflow-y:auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 24px)}
.front-inner{margin:auto 0;display:flex;flex-direction:column;gap:48px}
.stamp{position:relative;width:min(100%,400px);aspect-ratio:1.6;margin:0 auto;transform:rotate(-7deg)}
.stamp > *{position:absolute}
.plate,.glow{inset:6% 4% 18% 2%;clip-path:polygon(0 18%,74% 0,100% 12%,96% 100%,6% 86%)}
.plate{background:var(--night);border:4px solid var(--cyan);box-shadow:0 0 0 4px var(--mag) inset}
.glow{background:var(--cyan);filter:blur(18px);opacity:.35;z-index:-1}
.month{left:6%;top:20%;font-family:var(--num);font-size:clamp(66px,22vw,108px);line-height:.8;color:var(--night);-webkit-text-stroke:3px var(--cyan);text-shadow:4px 4px 0 var(--mag);transform:rotate(-10deg)}
.slash{left:23%;top:28%;width:12%;height:62%;background:var(--mag);clip-path:polygon(75% 0,100% 0,25% 100%,0 100%)}
.day{left:34%;top:4%;font-family:var(--num);font-size:clamp(104px,36vw,168px);line-height:.85;color:var(--white);text-shadow:-4px 0 0 var(--cyan),5px 5px 0 var(--mag)}
.icon{right:0;top:0;width:28%;aspect-ratio:1;background:var(--volt);clip-path:polygon(8% 0,100% 10%,92% 100%,0 88%);display:grid;place-items:center;transform:rotate(9deg)}
.icon svg{width:74%;height:74%}
.weekday{right:2%;bottom:22%;font-family:var(--tech);font-weight:900;font-size:clamp(17px,5.6vw,26px);background:var(--mag);color:var(--night);padding:2px 10px 0;transform:rotate(-12deg);border:3px solid var(--night);letter-spacing:1px}
.phase{left:-2%;bottom:-10%;font-family:var(--tech);font-weight:900;font-size:clamp(24px,8.5vw,40px);color:var(--cyan);background:var(--night);padding:0 12px;border:3px solid var(--cyan);transform:rotate(4deg)}

/* ===== cards / forms ===== */
.card{display:grid;gap:12px;animation:rise .45s .15s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.tabs{display:flex;gap:8px}
.tab{flex:1;background:none;border:2px solid var(--cyan);color:var(--cyan);padding:9px;font-family:var(--tech);font-size:13px}
.tab[aria-selected="true"]{background:var(--cyan);color:var(--night)}
.card label{font-family:var(--tech);font-size:12px;color:var(--cyan);letter-spacing:.5px}
.field{width:100%;background:rgba(7,4,26,.85);color:var(--white);border:2px solid var(--cyan);padding:12px 14px;font-size:18px;clip-path:polygon(0 0,97% 0,100% 30%,100% 100%,3% 100%,0 70%)}
.go{font-family:var(--tech);font-weight:900;font-size:21px;background:var(--mag);color:var(--night);border:none;padding:14px;margin-top:4px;clip-path:polygon(0 10%,100% 0,98% 90%,2% 100%);box-shadow:0 0 24px var(--mag)}
.go:active{transform:scale(.97)}
.msgline{font-size:16px;min-height:20px;color:var(--volt)}
.msgline.bad{color:var(--red)}
.note{font-size:14px;color:var(--muted);text-align:center}
.whoami{display:flex;align-items:center;gap:12px}
.whoami .who-text{font-size:17px;line-height:1.1}
.whoami .who-text b{font-family:var(--tech);color:var(--mag);font-size:15px}
.ghost{margin-left:auto;background:none;border:2px solid var(--cyan);color:var(--cyan);padding:6px 10px;font-family:var(--tech);font-size:11px}

/* avatars */
.face{flex:none;width:48px;height:48px;display:grid;place-items:center;font-family:var(--tech);font-weight:900;font-size:22px;color:var(--night);background:var(--c,var(--cyan));clip-path:polygon(10% 0,100% 8%,90% 100%,0 92%);overflow:hidden;border:none;padding:0}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.sm{width:40px;height:40px;font-size:18px}
.face.lg{width:132px;height:132px;font-size:60px}

/* ===== chat ===== */
.top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:2px solid var(--mag);background:rgba(7,4,26,.78);backdrop-filter:blur(6px)}
.mini{font-family:var(--num);font-size:32px;line-height:1;transform:rotate(-6deg);color:var(--white);text-shadow:-2px 0 var(--cyan),3px 3px var(--mag)}
.mini small{font-family:var(--tech);font-size:10px;color:var(--volt);margin-left:3px;vertical-align:middle}
.roombox{min-width:0}
.roomname{font-family:var(--tech);font-size:13px;color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:13px;color:var(--muted)}
.top .ghost{margin-left:auto}

.feed{flex:1;overflow-y:auto;padding:18px 10px;display:flex;flex-direction:column;gap:16px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:17px;max-width:24ch}
.msg{display:flex;align-items:flex-start;max-width:92%;transform:rotate(var(--tilt,0));animation:snap .26s cubic-bezier(.2,1.6,.4,1) both}
.msg:nth-child(3n+1){--tilt:-1.5deg}.msg:nth-child(3n+2){--tilt:1deg}
.msg.me{align-self:flex-end;flex-direction:row-reverse;animation-name:snapR}
@keyframes snap{from{opacity:0;transform:translateX(-36px) rotate(-8deg)}}
@keyframes snapR{from{opacity:0;transform:translateX(36px) rotate(8deg)}}
.msg .face{position:relative;top:16px;transform:rotate(-8deg);z-index:2}
.msg.me .face{transform:rotate(8deg)}
.col{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.me .col{align-items:flex-end}
.tag{font-family:var(--tech);font-size:11px;background:var(--night);color:var(--cyan);border:2px solid var(--cyan);padding:2px 8px;margin:0 0 -3px 12px;transform:rotate(-3deg);position:relative;z-index:1;white-space:nowrap}
.me .tag{margin:0 12px -3px 0;transform:rotate(3deg);color:var(--mag);border-color:var(--mag)}
.tag b{color:var(--volt);margin-right:6px}
.bubble{position:relative;padding:14px 22px;font-size:19px;font-weight:600;line-height:1.25;overflow-wrap:anywhere;color:var(--white);filter:drop-shadow(3px 3px 0 var(--mag)) drop-shadow(0 0 8px rgba(0,240,255,.35))}
.bubble::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--night);clip-path:polygon(0 14%,97% 0,100% 58%,93% 100%,3% 88%);box-shadow:inset 0 0 0 2px var(--cyan)}
.me .bubble{color:var(--night);filter:drop-shadow(-3px 3px 0 var(--cyan))}
.me .bubble::before{background:var(--mag);clip-path:polygon(3% 0,100% 12%,96% 90%,7% 100%,0 48%)}
.bubble a{color:var(--volt);text-decoration:underline;text-underline-offset:3px}
.me .bubble a{color:var(--night);font-weight:700}
.shot{display:block;border:none;padding:0;background:none;margin:2px 0 6px}
.shot img{display:block;max-width:min(62vw,260px);max-height:320px;border:3px solid var(--cyan);transform:rotate(-1deg)}
.me .shot img{border-color:var(--night)}

.compose{padding:8px 12px calc(env(safe-area-inset-bottom) + 12px);background:rgba(7,4,26,.92);border-top:2px solid var(--cyan)}
.pending{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:15px;color:var(--muted)}
.pending img{width:56px;height:56px;object-fit:cover;border:2px solid var(--mag)}
.pending button{background:none;border:2px solid var(--muted);color:var(--muted);padding:2px 8px}
.row{display:flex;gap:8px;align-items:flex-end}
.clip{flex:none;width:46px;height:46px;background:var(--deep);border:2px solid var(--mag);display:grid;place-items:center}
.clip svg{width:24px;height:24px}
.row textarea{flex:1;resize:none;background:var(--deep);color:var(--white);border:2px solid var(--cyan);padding:11px 12px;font-size:17px;max-height:120px;min-height:46px}
.send{flex:none;font-family:var(--tech);font-weight:900;font-size:15px;background:var(--cyan);color:var(--night);border:none;padding:13px 15px;clip-path:polygon(0 0,100% 12%,92% 100%,6% 88%)}
.send:active{transform:scale(.92) rotate(-4deg)}

/* ===== overlays ===== */
.overlay{position:fixed;inset:0;z-index:10;background:rgba(7,4,26,.86);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{width:min(100%,380px);background:var(--night);border:3px solid var(--cyan);box-shadow:8px 8px 0 var(--mag);padding:26px 22px;display:grid;gap:14px;justify-items:center;text-align:center;transform:rotate(-1.5deg)}
.sheet h2{font-family:var(--tech);font-size:20px;color:var(--cyan)}
.sheet .uname{font-family:var(--tech);font-size:18px;color:var(--mag)}
.sheet .email{color:var(--muted);font-size:15px;margin-top:-10px}
.sheet .go{width:100%}
.sheet .ghost{margin:0;width:100%;padding:10px;font-size:13px}
.danger{background:none;border:2px solid var(--red);color:var(--red);width:100%;padding:10px;font-family:var(--tech);font-size:13px}
.lightbox img{max-width:100%;max-height:90dvh;border:3px solid var(--cyan);box-shadow:8px 8px 0 var(--mag)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="sky"><canvas id="stars"></canvas></div>

<!-- ============ FRONT ============ -->
<section class="screen front" id="front">
 <div class="front-inner">
  <div class="stamp">
    <div class="glow"></div><div class="plate"></div>
    <div class="month" id="sMonth"></div><div class="slash"></div>
    <div class="day" id="sDay"></div>
    <div class="icon" id="sIcon"></div>
    <div class="weekday" id="sWeek"></div>
    <div class="phase" id="sPhase"></div>
  </div>

  <!-- logged out -->
  <form class="card hidden" id="authCard" novalidate>
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" id="tabIn" aria-selected="true">Log in</button>
      <button type="button" class="tab" role="tab" id="tabUp" aria-selected="false">Sign up</button>
    </div>
    <div id="unameWrap" class="card hidden" style="animation:none">
      <label for="uname">Username</label>
      <input class="field" id="uname" maxlength="20" autocomplete="username" placeholder="3–20 letters, numbers, _">
    </div>
    <label for="email">Email</label>
    <input class="field" id="email" type="email" autocomplete="email">
    <label for="pass">Password</label>
    <input class="field" id="pass" type="password" autocomplete="current-password" placeholder="At least 6 characters">
    <p class="msgline" id="authMsg" role="status"></p>
    <button class="go" type="submit" id="authBtn">Log in</button>
    <p class="note" id="modeNote"></p>
  </form>

  <!-- logged in -->
  <form class="card hidden" id="roomCard">
    <div class="whoami">
      <div class="face" id="meFace"></div>
      <div class="who-text">Signed in as<br><b id="meName"></b></div>
      <button type="button" class="ghost" id="openProfile1">Profile</button>
    </div>
    <label for="room">Room code</label>
    <input class="field" id="room" maxlength="30" placeholder="Same code as your friends" required>
    <button class="go" type="submit">Jump in</button>
  </form>
 </div>
</section>

<!-- ============ CHAT ============ -->
<section class="screen hidden" id="chat">
  <div class="top">
    <button class="face sm" id="openProfile2" aria-label="Your profile"></button>
    <div class="mini" id="miniDate"></div>
    <div class="roombox"><div class="roomname" id="roomLabel"></div><div class="status" id="status"></div></div>
    <button class="ghost" id="leave" type="button">Leave</button>
  </div>
  <main class="feed" id="feed" aria-live="polite"></main>
  <form class="compose" id="sendForm">
    <div class="pending hidden" id="pending"><img id="pendingImg" alt="Photo to send"><span>Photo ready</span><button type="button" id="unpick">Remove</button></div>
    <div class="row">
      <button type="button" class="clip" id="pickBtn" aria-label="Add a photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FF2BD6" stroke-width="2.4"><rect x="3" y="5" width="18" height="14"/><circle cx="12" cy="12" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
      </button>
      <input type="file" id="picker" accept="image/*" class="sr">
      <label for="box" class="sr">Message</label>
      <textarea id="box" rows="1" placeholder="Transmit…"></textarea>
      <button class="send" type="submit" id="sendBtn">Send</button>
    </div>
  </form>
</section>

<!-- ============ PROFILE SHEET ============ -->
<div class="overlay hidden" id="profile" role="dialog" aria-modal="true" aria-labelledby="profTitle">
  <div class="sheet">
    <h2 id="profTitle">Your profile</h2>
    <div class="face lg" id="profFace"></div>
    <div class="uname" id="profName"></div>
    <div class="email" id="profEmail"></div>
    <input type="file" id="avatarPicker" accept="image/*" class="sr">
    <button class="go" type="button" id="changePhoto">Change photo</button>
    <button class="ghost" type="button" id="notifBtn">Turn on notifications</button>
    <p class="msgline" id="profMsg" role="status"></p>
    <button class="danger" type="button" id="logout">Log out</button>
    <button class="ghost" type="button" id="closeProfile">Close</button>
  </div>
</div>

<div class="overlay lightbox hidden" id="lightbox"><img id="lightImg" alt="Full size photo"></div>

<script>
/* ===== SETUP: paste your Supabase project info (Project Settings → API) =====
   Leave blank to run in demo mode. */
const SUPABASE_URL = "https://iqxmnodyxfgljlopprju.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "sb_publishable_elzC4wE2PQl8u7v2MFSJUQ_gVhgaqVc";
const VAPID_PUBLIC_KEY = "BH1R-EpQ0TC_In2To11SHILhBllGEaR0cfoipyBnisIN5-Y0aRIPLTUHkloolRQ3TIptFrsMf6rF-3JXtTPCwnI";   // from `npx web-push generate-vapid-keys` (the PUBLIC one only)

const $ = id => document.getElementById(id);
const show = (el, on=true) => el.classList.toggle("hidden", !on);
const DAYS=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
const COLORS=["#00F0FF","#FF2BD6","#F3FF3A","#7CFF6B","#FF8A3D","#B18CFF"];
const colorFor = s => COLORS[[...(s||"?")].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];

/* ---------- date stamp ---------- */
const sun='<svg viewBox="0 0 100 100"><g fill="#07041A"><circle cx="50" cy="50" r="22"/>'+[...Array(8)].map((_,i)=>`<polygon points="50,2 58,20 42,20" transform="rotate(${i*45} 50 50)"/>`).join("")+'</g></svg>';
const moon='<svg viewBox="0 0 100 100"><path fill="#07041A" d="M62 12a40 40 0 1 0 28 60A32 32 0 0 1 62 12z"/><polygon fill="#07041A" points="24,18 27,26 35,27 29,32 31,40 24,36 17,40 19,32 13,27 21,26"/></svg>';
const phaseOf = h => h<5?"Late Night":h<12?"Morning":h<17?"Afternoon":h<21?"Evening":"Night";
function paintDate(){
  const d=new Date(), h=d.getHours();
  $("sMonth").textContent=d.getMonth()+1; $("sDay").textContent=d.getDate();
  $("sWeek").textContent=DAYS[d.getDay()]; $("sPhase").textContent=phaseOf(h);
  $("sIcon").innerHTML=(h>=6&&h<19)?sun:moon;
  $("miniDate").innerHTML=`${d.getMonth()+1}/${d.getDate()}<small>${DAYS[d.getDay()].slice(0,3)}</small>`;
}
paintDate(); setInterval(paintDate,60000);

/* ---------- starfield ---------- */
(function(){
  const c=$("stars"),x=c.getContext("2d"); let s=[];
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
    s=[...Array(160)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.6*devicePixelRatio,p:Math.random()*6}))}
  function draw(t){x.clearRect(0,0,c.width,c.height);
    s.forEach((o,i)=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t/1400+o.p));x.fillStyle=i%9==0?"#00F0FF":i%13==0?"#FF2BD6":"#fff";x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()});
    if(!still) requestAnimationFrame(draw)}
  size(); addEventListener("resize",size); requestAnimationFrame(draw);
})();

/* ---------- image helpers ---------- */
function loadImg(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("That file isn't an image we can read."));i.src=URL.createObjectURL(file)})}
async function shrink(file,max,square){
  if(file.type==="image/gif" && !square && file.size<5e6) return file;       // keep GIFs animated
  const img=await loadImg(file); let sw=img.width, sh=img.height, sx=0, sy=0;
  if(square){const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m;}
  const k=Math.min(1,max/Math.max(sw,sh)), c=document.createElement("canvas");
  c.width=Math.round(sw*k); c.height=Math.round(sh*k);
  c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}
const safeImg = u => typeof u==="string" && (u.startsWith("https://")||u.startsWith("blob:")) ? u : null;

/* ---------- links ---------- */
function linkify(el,text){
  const re=/((?:https?:\/\/|www\.)[^\s<]+[^\s<.,:;"')\]!?])/gi; let last=0, m;
  while((m=re.exec(text))){
    el.append(text.slice(last,m.index));
    const a=document.createElement("a"); const href=m[0].startsWith("www.")?"https://"+m[0]:m[0];
    a.href=href; a.textContent=m[0]; a.target="_blank"; a.rel="noopener noreferrer";
    el.append(a); last=m.index+m[0].length;
  }
  el.append(text.slice(last));
}

/* ================= BACKEND ================= */
let sb=null;
try{ if(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){}

const live = {
  async session(){ const {data}=await sb.auth.getSession(); return data.session?.user||null; },
  onAuth(cb){ sb.auth.onAuthStateChange((_e,s)=>cb(s?.user||null)); },
  async signUp(username,email,password){
    const {data:taken}=await sb.from("profiles").select("id").ilike("username",username).maybeSingle();
    if(taken) throw new Error("That username is taken.");
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{username},emailRedirectTo:location.origin+location.pathname}});
    if(error) throw error;
    return data.session ? "in" : "confirm";
  },
  async signIn(email,password){ const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; },
  async signOut(){ await sb.auth.signOut(); },
  async profiles(ids){ const {data,error}=await sb.from("profiles").select("id,username,avatar_url").in("id",ids); if(error) throw error; return data; },
  async upload(bucket,uid,blob){
    const ext=blob.type==="image/gif"?"gif":"jpg", path=`${uid}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await sb.storage.from(bucket).upload(path,blob,{contentType:blob.type||"image/jpeg"});
    if(error) throw error;
    return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
  },
  async setAvatar(uid,url){ const {error}=await sb.from("profiles").update({avatar_url:url}).eq("id",uid); if(error) throw error; },
  async load(room){ const {data,error}=await sb.from("messages").select("*").eq("room",room).order("created_at",{ascending:true}).limit(200); if(error) throw error; return data; },
  async send(room,text,image_url){ const {data,error}=await sb.from("messages").insert({room,text:text||null,image_url:image_url||null}).select().single(); if(error) throw error; return data; },
  async joinRoom(room){ await sb.from("room_members").upsert({room,last_joined:new Date().toISOString()},{onConflict:"room,user_id"}); },
  async savePush(json){ const {error}=await sb.from("push_subscriptions").upsert({endpoint:json.endpoint,p256dh:json.keys.p256dh,auth:json.keys.auth},{onConflict:"endpoint"}); if(error) throw error; },
  async deletePush(endpoint){ await sb.from("push_subscriptions").delete().eq("endpoint",endpoint); },
  subscribe(room,onMsg,onProfile,onStatus){
    const ch=sb.channel("room-"+room)
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`room=eq.${room}`},p=>onMsg(p.new))
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"profiles"},p=>onProfile(p.new))
      .subscribe(s=>onStatus(s==="SUBSCRIBED"?"Live":"Reconnecting…"));
    return ()=>sb.removeChannel(ch);
  }
};

const demo = (()=>{ // in-memory stand-in so the preview works without a server
  let user=null, listeners=[], rooms={};
  const people={rook:{id:"rook",username:"Rook",avatar_url:null},vee:{id:"vee",username:"Vee",avatar_url:null}};
  const lines=["No way. Tell me everything.","That is so you.","Check this: www.example.com","Meet at the usual spot?","LOL stop"];
  let onMsgCb=null;
  return {
    async session(){ return user; },
    onAuth(cb){ listeners.push(cb); },
    async signUp(username,email){ user={id:"me",email,user_metadata:{username}}; people.me={id:"me",username,avatar_url:null}; listeners.forEach(f=>f(user)); return "in"; },
    async signIn(email){ const n=email.split("@")[0]||"you"; user={id:"me",email,user_metadata:{username:n}}; people.me=people.me||{id:"me",username:n,avatar_url:null}; listeners.forEach(f=>f(user)); },
    async signOut(){ user=null; listeners.forEach(f=>f(null)); },
    async profiles(ids){ return ids.map(i=>people[i]).filter(Boolean); },
    async upload(_b,_u,blob){ await new Promise(r=>setTimeout(r,400)); return URL.createObjectURL(blob); },
    async setAvatar(uid,url){ people[uid].avatar_url=url; },
    async load(room){ return rooms[room] ||= [
      {id:"d1",room,user_id:"rook",text:"Signal's clear. Who's online?",created_at:new Date(Date.now()-90000).toISOString()},
      {id:"d2",room,user_id:"vee",text:"Here. Bring snacks.",created_at:new Date(Date.now()-60000).toISOString()}]; },
    async send(room,text,image_url){
      const m={id:"m"+Math.random(),room,user_id:"me",text,image_url,created_at:new Date().toISOString()}; rooms[room].push(m);
      setTimeout(()=>{ const who=Math.random()<.5?"rook":"vee"; const r={id:"r"+Math.random(),room,user_id:who,text:lines[Math.floor(Math.random()*lines.length)],created_at:new Date().toISOString()}; rooms[room].push(r); onMsgCb&&onMsgCb(r); },1100+Math.random()*1200);
      return m; },
    async joinRoom(){}, async savePush(){}, async deletePush(){},
    subscribe(_room,onMsg,_p,onStatus){ onMsgCb=onMsg; onStatus("Demo mode"); return ()=>{onMsgCb=null}; }
  };
})();
const api = sb ? live : demo;
$("modeNote").textContent = sb ? "" : "Demo mode: no server connected, so accounts and friends are simulated.";

/* ================= APP STATE ================= */
let user=null, meProfile=null, room="", unsub=null, pendingFile=null;
const cache=new Map(); const seen=new Set();
const feed=$("feed");

function paintFace(el,p){
  el.style.setProperty("--c",colorFor(p?.username));
  el.textContent=""; const url=safeImg(p?.avatar_url);
  if(url){ const i=document.createElement("img"); i.src=url; i.alt=""; el.append(i); }
  else el.textContent=(p?.username||"?")[0].toUpperCase();
}
function paintMe(){
  ["meFace","openProfile2","profFace"].forEach(id=>paintFace($(id),meProfile));
  $("meName").textContent=meProfile?.username||""; $("profName").textContent=meProfile?.username||""; $("profEmail").textContent=user?.email||"";
}

async function refreshMe(){
  const [p]=await api.profiles([user.id]).catch(()=>[]);
  meProfile=p||{id:user.id,username:user.user_metadata?.username||"you",avatar_url:null};
  cache.set(user.id,meProfile); paintMe();
}

async function handleAuth(u){
  user=u;
  if(!u){ if(unsub){unsub();unsub=null;} show($("chat"),false); show($("profile"),false); show($("front")); show($("authCard")); show($("roomCard"),false); return; }
  await refreshMe();
  show($("authCard"),false); show($("roomCard"));
  try{ $("room").value=localStorage.getItem("nl-room")||""; }catch(e){}
  const linked=new URLSearchParams(location.search).get("room");
  if(linked){ history.replaceState(null,"",location.pathname); enterRoom(linked); }
}

/* ---------- auth form ---------- */
let mode="in";
function setMode(m){
  mode=m; $("tabIn").setAttribute("aria-selected",m==="in"); $("tabUp").setAttribute("aria-selected",m==="up");
  show($("unameWrap"),m==="up"); $("authBtn").textContent=m==="in"?"Log in":"Create account";
  $("pass").autocomplete=m==="in"?"current-password":"new-password"; say("authMsg","");
}
$("tabIn").onclick=()=>setMode("in"); $("tabUp").onclick=()=>setMode("up");
function say(id,text,bad){ $(id).textContent=text; $(id).classList.toggle("bad",!!bad); }

$("authCard").addEventListener("submit",async e=>{
  e.preventDefault();
  const email=$("email").value.trim(), pass=$("pass").value, uname=$("uname").value.trim();
  if(mode==="up" && !/^[A-Za-z0-9_]{3,20}$/.test(uname)) return say("authMsg","Username needs 3–20 letters, numbers, or underscores.",true);
  if(!/^\S+@\S+\.\S+$/.test(email)) return say("authMsg","Enter a valid email.",true);
  if(pass.length<6) return say("authMsg","Password needs at least 6 characters.",true);
  $("authBtn").disabled=true; say("authMsg",mode==="in"?"Logging in…":"Creating account…");
  try{
    if(mode==="in") await api.signIn(email,pass);
    else { const r=await api.signUp(uname,email,pass); if(r==="confirm"){ say("authMsg","Check your email to confirm, then log in."); setTimeout(()=>setMode("in"),50); } }
    $("pass").value="";
  }catch(err){
    const m=/invalid login/i.test(err.message)?"Wrong email or password.":/already registered/i.test(err.message)?"That email already has an account. Log in instead.":err.message;
    say("authMsg",m,true);
  }finally{ $("authBtn").disabled=false; }
});

/* ---------- profile ---------- */
const openProfile=()=>{ say("profMsg",""); paintNotif(); show($("profile")); $("closeProfile").focus(); };
$("openProfile1").onclick=openProfile; $("openProfile2").onclick=openProfile;
$("closeProfile").onclick=()=>show($("profile"),false);
$("profile").addEventListener("click",e=>{ if(e.target.id==="profile") show($("profile"),false); });
$("changePhoto").onclick=()=>$("avatarPicker").click();
$("avatarPicker").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if(f.size>15e6) return say("profMsg","That photo is over 15 MB. Pick a smaller one.",true);
  $("changePhoto").disabled=true; say("profMsg","Uploading…");
  try{
    const blob=await shrink(f,400,true);
    const url=await api.upload("avatars",user.id,blob);
    await api.setAvatar(user.id,url);
    meProfile={...meProfile,avatar_url:url}; cache.set(user.id,meProfile); paintMe(); repaintFaces(user.id);
    say("profMsg","Photo saved.");
  }catch(err){ say("profMsg","Upload failed: "+err.message,true); }
  finally{ $("changePhoto").disabled=false; }
};
$("logout").onclick=async()=>{ $("logout").disabled=true; await pushOff(true).catch(()=>{}); await api.signOut(); $("logout").disabled=false; };

/* ---------- chat ---------- */
function repaintFaces(uid){ feed.querySelectorAll(`.face[data-uid="${CSS.escape(uid)}"]`).forEach(el=>paintFace(el,cache.get(uid))); }

async function ensureProfiles(ids){
  const need=[...new Set(ids)].filter(i=>i&&!cache.has(i)); if(!need.length) return;
  (await api.profiles(need).catch(()=>[])).forEach(p=>cache.set(p.id,p));
}

async function render(m){
  if(seen.has(m.id)) return; seen.add(m.id);
  await ensureProfiles([m.user_id]);
  feed.querySelector(".empty")?.remove();
  const p=cache.get(m.user_id)||{username:"Unknown"}, mine=m.user_id===user.id;
  const at=new Date(m.created_at), fresh=!mine&&Date.now()-at<15000;
  const el=document.createElement("div"); el.className="msg"+(mine?" me":"");
  const face=document.createElement("div"); face.className="face"; face.dataset.uid=m.user_id; face.setAttribute("aria-hidden","true"); paintFace(face,p);
  const col=document.createElement("div"); col.className="col";
  const tag=document.createElement("div"); tag.className="tag";
  if(fresh){ const b=document.createElement("b"); b.textContent="NEW"; tag.append(b); }
  tag.append(`${p.username} · ${at.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}`);
  const bub=document.createElement("div"); bub.className="bubble";
  const img=safeImg(m.image_url);
  if(img){ const btn=document.createElement("button"); btn.type="button"; btn.className="shot"; btn.setAttribute("aria-label","Open photo");
    const i=document.createElement("img"); i.src=img; i.alt="Photo from "+p.username; i.loading="lazy"; i.onload=()=>feed.scrollTop=feed.scrollHeight;
    btn.append(i); btn.onclick=()=>{ $("lightImg").src=img; show($("lightbox")); }; bub.append(btn); }
  if(m.text){ const t=document.createElement("div"); linkify(t,m.text); bub.append(t); }
  col.append(tag,bub); el.append(face,col); feed.append(el); feed.scrollTop=feed.scrollHeight;
  if(fresh&&navigator.vibrate) navigator.vibrate(30);
}

$("roomCard").addEventListener("submit",e=>{ e.preventDefault(); enterRoom($("room").value); });
async function enterRoom(code){
  room=(code||"").trim().toLowerCase(); if(!room||!user) return;
  if(unsub){unsub();unsub=null;}
  api.joinRoom(room).catch(()=>{});
  try{ localStorage.setItem("nl-room",room); }catch(e){}
  show($("front"),false); show($("chat")); $("roomLabel").textContent="Room: "+room; $("status").textContent="Connecting…";
  feed.innerHTML=""; seen.clear();
  try{
    const msgs=await api.load(room);
    await ensureProfiles(msgs.map(m=>m.user_id));
    for(const m of msgs) await render(m);
    if(!msgs.length) feed.innerHTML='<p class="empty">Nobody has said anything here yet. Start it off.</p>';
    unsub=api.subscribe(room,render,p=>{ cache.set(p.id,p); repaintFaces(p.id); if(p.id===user.id){meProfile=p;paintMe();} },s=>$("status").textContent=s);
  }catch(err){ $("status").textContent="Can't load messages. Check your Supabase setup."; }
}
$("leave").onclick=()=>{ if(unsub){unsub();unsub=null;} clearPending(); show($("chat"),false); show($("front")); };

function clearPending(){ pendingFile=null; show($("pending"),false); }
$("pickBtn").onclick=()=>$("picker").click();
$("picker").onchange=e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if(f.size>15e6){ $("status").textContent="Photo is over 15 MB."; return; }
  pendingFile=f; $("pendingImg").src=URL.createObjectURL(f); show($("pending"));
};
$("unpick").onclick=clearPending;

$("sendForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=$("box").value.trim(); if(!text&&!pendingFile) return;
  $("sendBtn").disabled=true;
  try{
    let url=null;
    if(pendingFile){ $("status").textContent="Uploading photo…"; url=await api.upload("chat-images",user.id,await shrink(pendingFile,1280,false)); }
    const m=await api.send(room,text,url);
    $("box").value=""; $("box").style.height=""; clearPending(); $("status").textContent=sb?"Live":"Demo mode";
    render(m);
  }catch(err){ $("status").textContent="Didn't send: "+err.message; }
  finally{ $("sendBtn").disabled=false; }
});
$("box").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer: coarse)").matches){e.preventDefault();$("sendForm").requestSubmit();} });
$("box").addEventListener("input",function(){this.style.height="auto";this.style.height=this.scrollHeight+"px"});
$("lightbox").onclick=()=>show($("lightbox"),false);
addEventListener("keydown",e=>{ if(e.key==="Escape"){ show($("lightbox"),false); show($("profile"),false); } });


/* ================= PUSH NOTIFICATIONS ================= */
let swReg=null;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const installed=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  navigator.serviceWorker.register("sw.js").then(r=>swReg=r).catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{ if(e.data?.room && user){ show($("profile"),false); enterRoom(e.data.room); } });
}
function b64ToBytes(b){ const p="=".repeat((4-b.length%4)%4), s=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(s,c=>c.charCodeAt(0)); }
async function currentSub(){ return swReg ? swReg.pushManager.getSubscription() : null; }

async function paintNotif(){
  const btn=$("notifBtn");
  if(!sb||!VAPID_PUBLIC_KEY){ btn.disabled=true; btn.textContent="Notifications: not set up yet"; return; }
  if(isIOS&&!installed){ btn.disabled=true; btn.textContent="Add to Home Screen to get notifications"; return; }
  if(!swReg||!("PushManager" in window)){ btn.disabled=true; btn.textContent="Notifications not supported here"; return; }
  if(Notification.permission==="denied"){ btn.disabled=true; btn.textContent="Notifications blocked in settings"; return; }
  btn.disabled=false; btn.textContent=(await currentSub())?"Turn off notifications":"Turn on notifications";
}
async function pushOn(){
  if(await Notification.requestPermission()!=="granted") throw new Error("Permission wasn't given.");
  const sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(VAPID_PUBLIC_KEY)});
  await api.savePush(sub.toJSON());
}
async function pushOff(){
  const sub=await currentSub(); if(!sub) return;
  await api.deletePush(sub.endpoint); await sub.unsubscribe();
}
$("notifBtn").onclick=async()=>{
  $("notifBtn").disabled=true;
  try{
    if(await currentSub()){ await pushOff(); say("profMsg","Notifications off."); }
    else { await pushOn(); say("profMsg","Notifications on for rooms you've joined."); }
  }catch(err){ say("profMsg",err.message,true); }
  paintNotif();
};

/* ---------- boot ---------- */
setMode("in");
api.onAuth(u=>{ if((u?.id||null)!==(user?.id||null)) handleAuth(u); });
api.session().then(handleAuth);
</script>
